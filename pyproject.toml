[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightspeed-regression-suite"
version = "0.1.0"
description = "Regression tests for Lightspeed Core"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML>=6.0,<7.0",
  "pytest>=8.0,<9.0",
  "requests>=2.31,<3.0",
]

[project.scripts]
lightspeed-config-adapter = "lightspeed_suite.config_adapter:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

name: Test Suite Build

on:
  push:
    branches:
      - main
      - 'release-*'

env:
  IMAGE_NAME: lightspeed-regression-runner
  IMAGE_REGISTRY: quay.io
  REGISTRY_ORG: rh-ee-jdubrick
  CONTAINER_FILE: test-suite/Containerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Install buildah
        run: |
          sudo apt update
          sudo apt install -y buildah qemu-user-static

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tags
        id: compute_tags
        run: |
          branch="${GITHUB_REF_NAME}"
          date_utc="$(date -u +%m%d%Y)"
          short_sha="${GITHUB_SHA:0:7}"

          if [[ "${branch}" == "main" ]]; then
            printf -v tags '%s\n' "latest"
          else
            printf -v tags '%s\n' \
              "${branch}-${date_utc}-${short_sha}" \
              "${branch}-latest"
          fi

          {
            echo "tags<<EOF"
            printf '%s' "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "Branch: ${branch}"
          echo "UTC date: ${date_utc}"
          echo "Tags:"
          printf '%s' "${tags}"

      - name: Build image with Buildah
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: |
            ${{ steps.compute_tags.outputs.tags }}
          containerfiles: |
            ${{ env.CONTAINER_FILE }}
          archs: amd64, arm64
          oci: true
          context: test-suite

      - name: Check images
        run: |
          buildah images | grep '${{ env.IMAGE_NAME }}'
          echo 'Image: ${{ steps.build_image.outputs.image }}'
          echo 'Tags: ${{ steps.build_image.outputs.tags }}'

      - name: Check manifest
        env:
          IMAGE: ${{ steps.build_image.outputs.image }}
          TAGS: ${{ steps.compute_tags.outputs.tags }}
        run: |
          set -x
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            buildah manifest inspect "${IMAGE}:${tag}"
          done <<< "${TAGS}"

      - name: Push image to Quay.io
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_ORG }}
          username: ${{ secrets.QUAY_REGISTRY_USERNAME }}
          password: ${{ secrets.QUAY_REGISTRY_PASSWORD }}